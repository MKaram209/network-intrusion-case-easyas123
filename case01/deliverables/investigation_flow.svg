<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 610" width="1280" height="610" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<title>Investigation flow: NetSupport Manager RAT infection traced through a packet capture</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1 1 L9 5 L1 9 z" fill="#8c959f"/></marker></defs>
<rect width="1280" height="610" rx="16" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="48" y="70" font-size="30" font-weight="700" fill="#111827">Network intrusion investigation</text>
<text x="48" y="100" font-size="16" fill="#57606a">Tracing a NetSupport Manager RAT infection through a packet capture of an Active Directory network</text>
<rect x="48" y="126" width="1184" height="48" rx="8" fill="#fdecec" stroke="#f0b4b6"/>
<text x="68" y="156" font-size="14.5" fill="#7f1d1d">Starting point: the SIEM flagged RAT traffic to 45.131.214[.]85 on TCP 443 from 19:55 UTC. Which machine is infected, and what is it doing?</text>
<rect x="48" y="206" width="220" height="236" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<circle cx="78" cy="236" r="14" fill="#111827"/>
<text x="78" y="241" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="66" y="282" font-size="15" font-weight="700" fill="#111827">Verify the evidence</text>
<text x="66" y="304" font-size="12.5" fill="#57606a">sha256sum, capinfos</text>
<line x1="66" y1="318" x2="250" y2="318" stroke="#d0d7de"/>
<text x="66" y="344" font-size="13.5" fill="#111827">15,512 packets, 4h 20m</text>
<text x="66" y="366" font-size="13.5" fill="#111827">SHA256 3dc470f5...407e61</text>
<text x="66" y="388" font-size="13.5" fill="#111827">Hash saved before analysis</text>
<text x="66" y="410" font-size="13.5" fill="#111827">Evidence file never edited</text>
<line x1="272" y1="236" x2="288" y2="236" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="289" y="206" width="220" height="236" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<circle cx="319" cy="236" r="14" fill="#111827"/>
<text x="319" y="241" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="307" y="282" font-size="15" font-weight="700" fill="#111827">Triage the traffic</text>
<text x="307" y="304" font-size="12.5" fill="#57606a">tshark protocol hierarchy</text>
<line x1="307" y1="318" x2="491" y2="318" stroke="#d0d7de"/>
<text x="307" y="344" font-size="13.5" fill="#111827">Active Directory network</text>
<text x="307" y="366" font-size="13.5" fill="#111827">Kerberos, SMB, LDAP, DNS</text>
<text x="307" y="388" font-size="13.5" fill="#111827">266 HTTP form POSTs</text>
<text x="307" y="410" font-size="13.5" fill="#111827">stand out as unusual</text>
<line x1="513" y1="236" x2="529" y2="236" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="530" y="206" width="220" height="236" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<circle cx="560" cy="236" r="14" fill="#111827"/>
<text x="560" y="241" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="548" y="282" font-size="15" font-weight="700" fill="#111827">Find the infected host</text>
<text x="548" y="304" font-size="12.5" fill="#57606a">who sends to the C2 IP?</text>
<line x1="548" y1="318" x2="732" y2="318" stroke="#d0d7de"/>
<text x="548" y="344" font-size="13.5" fill="#111827">IP 10.2.28.88</text>
<text x="548" y="366" font-size="13.5" fill="#111827">MAC 00:19:d1:b2:4d:ad</text>
<text x="548" y="388" font-size="13.5" fill="#111827">First contact 19:55:51 UTC</text>
<text x="548" y="410" font-size="13.5" fill="#111827">Frame 2569</text>
<line x1="754" y1="236" x2="770" y2="236" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="771" y="206" width="220" height="236" rx="10" fill="#ffffff" stroke="#d0d7de" stroke-width="1"/>
<circle cx="801" cy="236" r="14" fill="#111827"/>
<text x="801" y="241" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="789" y="282" font-size="15" font-weight="700" fill="#111827">Identify host and user</text>
<text x="789" y="304" font-size="12.5" fill="#57606a">NBNS, Kerberos, SAMR</text>
<line x1="789" y1="318" x2="973" y2="318" stroke="#d0d7de"/>
<text x="789" y="344" font-size="13.5" fill="#111827">Host DESKTOP-TEYQ2NR</text>
<text x="789" y="366" font-size="13.5" fill="#111827">User brolf</text>
<text x="789" y="388" font-size="13.5" fill="#111827">Full name Becka Rolf</text>
<text x="789" y="410" font-size="13.5" fill="#111827">Frames 135, 243, 339</text>
<line x1="995" y1="236" x2="1011" y2="236" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ah)"/>
<rect x="1012" y="206" width="220" height="236" rx="10" fill="#ffffff" stroke="#c2272d" stroke-width="1.8"/>
<circle cx="1042" cy="236" r="14" fill="#c2272d"/>
<text x="1042" y="241" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
<text x="1030" y="282" font-size="15" font-weight="700" fill="#111827">Analyze the C2 traffic</text>
<text x="1030" y="304" font-size="12.5" fill="#57606a">HTTP and conversation stats</text>
<line x1="1030" y1="318" x2="1214" y2="318" stroke="#d0d7de"/>
<text x="1030" y="344" font-size="13.5" fill="#111827">POST /fakeurl.htm</text>
<text x="1030" y="366" font-size="13.5" fill="#111827">Beacon every 60 seconds</text>
<text x="1030" y="388" font-size="13.5" fill="#111827">NetSupport Manager/1.3</text>
<text x="1030" y="410" font-size="13.5" fill="#111827">Active until capture ended</text>
<line x1="48" y1="472" x2="1232" y2="472" stroke="#d0d7de"/>
<text x="48" y="502" font-size="15" font-weight="700" fill="#111827">What the investigation produced</text>
<text x="48" y="534" font-size="14" font-weight="700" fill="#111827">IOC list</text>
<text x="48" y="556" font-size="12.5" fill="#57606a">C2 address, URL, user agent, beaconing</text>
<text x="344" y="534" font-size="14" font-weight="700" fill="#111827">Timeline and chart</text>
<text x="344" y="556" font-size="12.5" fill="#57606a">Events in UTC with frame numbers</text>
<text x="640" y="534" font-size="14" font-weight="700" fill="#111827">Mitigation plan</text>
<text x="640" y="556" font-size="12.5" fill="#57606a">Contain, clean up, and prevent</text>
<text x="936" y="534" font-size="14" font-weight="700" fill="#111827">Case log</text>
<text x="936" y="556" font-size="12.5" fill="#57606a">What I ran, why, and what it showed</text>
<text x="48" y="588" font-size="12" fill="#6e7781">Source: 2026-02-28 traffic analysis exercise from malware-traffic-analysis.net. All times UTC.</text>
</svg>